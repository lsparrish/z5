<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MONOLITH // RECT_BLIT_STRATEGY</title>
    <style>
        body { background: #000; margin: 0; overflow: hidden; font-family: 'Courier New', monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #hud { position: fixed; top: 10px; left: 10px; color: #0f0; background: rgba(0,0,0,0.8); padding: 15px; font-size: 11px; border: 1px solid #0f0; pointer-events: none; white-space: pre; z-index: 100;}
    </style>
</head>
<body>

<div id="hud">
[ MONOLITH_GPU_CORE ]
STRATEGY : RECTANGULAR_BLIT_STREAM
SOURCE   : INDEX_MAGNIFIER (32x16)
DEST     : ROW_9_CANDIDATES (36x1)
FPS      : <span id="fps">0</span>
</div>

<canvas id="view"></canvas>

<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }
</script>

<script id="fs_sim" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
precision highp usampler2D;

uniform usampler2D u_prev;   
uniform usampler2D u_targets; 
uniform int u_frame;

layout(location=0) out uvec4 outColor;

uint getLogicBit(int lx, int ly, uint bid) {
    int bx = lx / 9;
    int by = ly / 9;
    return (bid >> (uint(bx) + uint(by) * 3u)) & 1u;
}

void main() {
    ivec2 fc = ivec2(gl_FragCoord.xy);
    int charIdx = fc.x; // 0-35
    int row = fc.y;     // 0-9

    uvec4 self = texelFetch(u_prev, fc, 0);
    
    // 1. FILTER BANK (Rows 0-8)
    // These rows "watch" the row below them.
    // If the row below has a lower error, they swap (Bubble Sort).
    if (row < 9) {
        uvec4 below = texelFetch(u_prev, ivec2(charIdx, row + 1), 0);
        // "Catch" the candidate if it is better than what we have
        if (below.g < self.g) {
            outColor = below;
            return;
        }
    }

    // 2. STREAM BUFFER (Row 9)
    // This row unconditionally accepts the "Blit" from the Index Magnifier.
    // It acts as the read-head for the scanner.
    if (row == 9) {
        // Calculate Source ID (The "Rectangular Copy")
        // Staggered: (Frame + CharID) -> Linear Sequence
        uint testBid = uint((u_frame + charIdx) % 512);
        
        // Compute Error (Parallel for all 36 chars)
        uint err = 0u;
        for (int y = 0; y < 27; y++) {
            for (int x = 0; x < 27; x++) {
                uint tgt = texelFetch(u_targets, ivec2(charIdx * 27 + x, 26 - y), 0).r;
                uint logic = getLogicBit(x, y, testBid);
                if (logic != tgt) err++;
            }
        }
        
        // UNCONDITIONAL WRITE (The Blit)
        // We write the candidate to the stream regardless of fitness.
        // Row 8 is responsible for deciding if it's worth keeping.
        outColor = uvec4(testBid, err, 0u, 255u);
        return;
    }

    outColor = self;
}
</script>

<script id="fs_vis" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
precision highp usampler2D;

uniform usampler2D u_state;
uniform usampler2D u_targets;
uniform usampler2D u_phrase;
uniform vec2 u_res;
uniform vec2 u_view; 
uniform float u_zoom;
uniform int u_frame;

out vec4 fragColor;

uint getLogicBit(int lx, int ly, uint bid) {
    int bx = lx / 9;
    int by = ly / 9;
    return (bid >> (uint(bx) + uint(by) * 3u)) & 1u;
}

uint getLUTBit(int wx, int wy) {
    int ax = wx/3; int ay = wy/3;
    int lin = (ax%32) + (ay%16)*32;
    int bid = (ax/32) + (ay/16)*16;
    return ((uint(lin) ^ uint(bid)) >> uint((wx%3)+(wy%3)*3)) & 1u;
}

// Checks if a linear atom ID is within the current 36-atom scan window
bool isInScanWindow(int bid) {
    int start = u_frame % 512;
    int end = (start + 35) % 512;
    if (start < end) return (bid >= start && bid <= end);
    else return (bid >= start || bid <= end); // Wrap case
}

void main() {
    float rawX = u_view.x + (gl_FragCoord.x / u_zoom);
    float rawY = u_view.y + (gl_FragCoord.y / u_zoom);
    
    // Inverse Plane
    bool isInv = false;
    if (rawX >= 4096.0) { isInv = true; rawX -= 4096.0; }

    int ix = int(floor(rawX));
    int iy = int(floor(rawY));

    float val = 0.0;
    
    // CONSTANTS
    int Y_REPO = 500;
    int Y_STACK = 2000;
    int Y_PHRASE = 2700;
    int RX_MAIN = 1550;
    int STRIDE = 27;

    // 1. PHRASE LINE
    if (ix >= RX_MAIN && iy >= Y_PHRASE && iy < Y_PHRASE + 27) {
        int px = ix - RX_MAIN;
        int charIdx = px / STRIDE;
        int lx = px % STRIDE;
        int ly = iy - Y_PHRASE;
        if (charIdx < 43) { 
            uint uIdx = texelFetch(u_phrase, ivec2(charIdx, 0), 0).r;
            if (uIdx < 255u) {
                uvec4 winner = texelFetch(u_state, ivec2(int(uIdx), 0), 0);
                if (getLogicBit(lx, ly, winner.r) > 0u) val = 1.0;
            }
        }
    }
    // 2. EVOLUTION STACK
    else if (ix >= RX_MAIN && iy >= Y_STACK && iy < Y_STACK + 567) {
        int sx = ix - RX_MAIN;
        int sy = iy - Y_STACK;
        int col = sx / STRIDE;
        int lx = sx % STRIDE;
        if (col < 36 && lx < 27) {
            if (sy >= 540) { // Target Row
                int ty = sy - 540;
                if (ty < 27) {
                   uint tgt = texelFetch(u_targets, ivec2(col * 27 + lx, 26 - ty), 0).r;
                   if (tgt > 0u) val = 1.0;
                }
            } else { // Stack
                int rowInv = sy / 54;
                int row = 9 - rowInv;
                int localY = sy % 54;
                uvec4 data = texelFetch(u_state, ivec2(col, row), 0);
                if (localY < 27) { // XOR
                    uint tgt = texelFetch(u_targets, ivec2(col * 27 + lx, 26 - localY), 0).r;
                    uint log = getLogicBit(lx, localY, data.r);
                    if (log != tgt) val = 1.0;
                } else { // Logic
                    if (getLogicBit(lx, localY - 27, data.r) > 0u) val = 1.0;
                }
            }
        }
    }
    // 3. ATOMIC STACK GRID (108x90)
    else if (ix >= 900 && ix < 900 + 108 && iy >= Y_REPO && iy < Y_REPO + 90) {
        int gx = ix - 900; int gy = iy - Y_REPO;
        int col = gx / 3; int row = 9 - (gy / 9);
        int subX = gx % 3; int subY = gy % 9;
        if (col < 36 && row < 10) {
            uvec4 data = texelFetch(u_state, ivec2(col, row), 0);
            uint bid = data.r; uint err = data.g;
            if (subY >= 6) { if (((bid >> (uint(subX) + uint(subY - 6) * 3u)) & 1u) > 0u) val = 1.0; }
            else if (subY >= 3) { if (((err >> (uint(subX) + uint(subY - 3) * 3u)) & 1u) > 0u) val = 1.0; }
            else { if ((((err >> 9u) >> (uint(subX) + uint(subY) * 3u)) & 1u) > 0u) val = 1.0; }
        }
    }
    // 4. INDEX MAGNIFIER (0, 500) - THE SOURCE
    else if (ix >= 0 && ix < 864 && iy >= Y_REPO && iy < Y_REPO + 432) {
        int mx = ix; int my = iy - Y_REPO;
        int bid = (mx / 27) + (my / 27) * 32;
        
        // Logic Pixel
        if (getLogicBit(mx % 27, my % 27, uint(bid)) > 0u) val = 1.0;

        // VISUALIZE SCAN REGION
        // We highlight the atoms currently being copied to the stack
        if (isInScanWindow(bid)) {
            // Draw a border or overlay
            int lbx = mx % 27; int lby = my % 27;
            if (lbx == 0 || lbx == 26 || lby == 0 || lby == 26) val = 1.0; // Box
            else if ((lbx+lby)%2 == 0) val *= 0.5; // Stipple content
        }
    }
    // 5. GLOBAL LUT
    else if (ix >= 0 && ix < 1536 && iy >= 1000 && iy < 2536) {
        if (getLUTBit(ix, iy - 1000) > 0u) val = 1.0;
    }
    
    if (isInv) val = 1.0 - val;
    fragColor = vec4(0.0, val, val * 0.2, 1.0);
}
</script>

<script>
const cvs = document.getElementById('view');
const gl = cvs.getContext('webgl2', { alpha: false, antialias: false });
if (!gl) alert("WebGL2 Required");

const STATE_W = 36, STATE_H = 10;
const TGT_W = 36 * 27, TGT_H = 27;

let frame = 0;
let lastTime = 0;
let view = { x: 1300, y: 1800, z: 1.0 };
let textures = { stateA: null, stateB: null, targets: null, phrase: null };
let activeState = 0;
let programs = {};

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
}

function createProgram(vsSrc, fsSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, createShader(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, createShader(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    return p;
}

function createTexture(w, h, iFmt, fmt, type, data) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, iFmt, w, h, 0, fmt, type, data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    return t;
}

function init() {
    const vs = document.getElementById('vs').text;
    programs.sim = createProgram(vs, document.getElementById('fs_sim').text);
    programs.vis = createProgram(vs, document.getElementById('fs_vis').text);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    const sData = new Uint32Array(STATE_W * STATE_H * 4).fill(0);
    for(let i=0; i<sData.length; i+=4) sData[i+1] = 9999;
    textures.stateA = createTexture(STATE_W, STATE_H, gl.RGBA32UI, gl.RGBA_INTEGER, gl.UNSIGNED_INT, sData);
    textures.stateB = createTexture(STATE_W, STATE_H, gl.RGBA32UI, gl.RGBA_INTEGER, gl.UNSIGNED_INT, sData);

    const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789".split("");
    const PHRASE = "THE QUICK BROWN FOX JUMPS OVER 13 LAZY DOGS";
    
    const pData = new Uint8Array(PHRASE.length);
    for(let i=0; i<PHRASE.length; i++) {
        const idx = UPPER.indexOf(PHRASE[i]);
        pData[i] = idx === -1 ? 255 : idx;
    }
    textures.phrase = createTexture(PHRASE.length, 1, gl.R8UI, gl.RED_INTEGER, gl.UNSIGNED_BYTE, pData);

    const tC = document.createElement('canvas'); tC.width = TGT_W; tC.height = TGT_H;
    const ctx = tC.getContext('2d');
    ctx.font = "800 81px monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="black"; ctx.fillRect(0,0,TGT_W,TGT_H); ctx.fillStyle="white";
    
    for (let i=0; i<UPPER.length; i++) {
        const tmp = document.createElement('canvas'); tmp.width = 162; tmp.height = 162;
        const tctx = tmp.getContext('2d');
        tctx.font = "800 81px monospace"; tctx.textAlign="center"; tctx.textBaseline="middle";
        tctx.fillStyle="white"; tctx.fillText(UPPER[i], 81, 81);
        const d = tctx.getImageData(0,0,162,162).data;
        let mnX=162, mxX=0, mnY=162, mxY=0;
        for(let y=0;y<162;y++) for(let x=0;x<162;x++) if(d[(y*162+x)*4]>100){ if(x<mnX)mnX=x; if(x>mxX)mxX=x; if(y<mnY)mnY=y; if(y>mxY)mxY=y; }
        if(mxX>0) ctx.drawImage(tmp, mnX, mnY, mxX-mnX+1, mxY-mnY+1, i*27, 0, 27, 27);
    }
    const tD = ctx.getImageData(0,0,TGT_W,TGT_H).data;
    const rD = new Uint8Array(TGT_W*TGT_H);
    for(let i=0; i<rD.length; i++) rD[i] = tD[i*4] > 100 ? 1 : 0;
    textures.targets = createTexture(TGT_W, TGT_H, gl.R8UI, gl.RED_INTEGER, gl.UNSIGNED_BYTE, rD);

    requestAnimationFrame(loop);
}

function loop(now) {
    if(frame%20 === 0) document.getElementById('fps').innerText = Math.round(1000/(now-lastTime));
    lastTime = now;

    // SIM
    gl.useProgram(programs.sim);
    gl.viewport(0, 0, STATE_W, STATE_H);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, activeState===0 ? textures.stateA : textures.stateB);
    gl.uniform1i(gl.getUniformLocation(programs.sim, "u_prev"), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, textures.targets);
    gl.uniform1i(gl.getUniformLocation(programs.sim, "u_targets"), 1);
    gl.uniform1i(gl.getUniformLocation(programs.sim, "u_frame"), frame);
    
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, activeState===0 ? textures.stateB : textures.stateA, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    activeState = 1 - activeState;

    // VIS
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, cvs.width, cvs.height);
    gl.useProgram(programs.vis);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, activeState===0 ? textures.stateA : textures.stateB);
    gl.uniform1i(gl.getUniformLocation(programs.vis, "u_state"), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, textures.targets);
    gl.uniform1i(gl.getUniformLocation(programs.vis, "u_targets"), 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, textures.phrase);
    gl.uniform1i(gl.getUniformLocation(programs.vis, "u_phrase"), 2);
    
    gl.uniform2f(gl.getUniformLocation(programs.vis, "u_res"), cvs.width, cvs.height);
    gl.uniform2f(gl.getUniformLocation(programs.vis, "u_view"), view.x, view.y);
    gl.uniform1f(gl.getUniformLocation(programs.vis, "u_zoom"), view.z);
    gl.uniform1i(gl.getUniformLocation(programs.vis, "u_frame"), frame);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.deleteFramebuffer(fbo);
    
    frame++;
    requestAnimationFrame(loop);
}

window.onkeydown = e => {
    let mv = 100/view.z;
    if (e.key === "PageUp") view.z *= 2; if (e.key === "PageDown") view.z /= 2;
    if (e.key === "ArrowUp") view.y += mv; if (e.key === "ArrowDown") view.y -= mv;
    if (e.key === "ArrowLeft") view.x -= mv; if (e.key === "ArrowRight") view.x += mv;
};
window.onresize = () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; };
window.onresize();
init();
</script>
</body>
</html>
